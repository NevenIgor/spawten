name: django-aiogram-stack

x-app-env: &app-env
  POSTGRES_DB: ${POSTGRES_DB:-app}
  POSTGRES_USER: ${POSTGRES_USER:-app}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
  DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-app}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api,nginx}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  ELASTIC_SEARCH_ENGINE_URL: http://elastic:9200
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  DJANGO_LANGUAGE: ${DJANGO_LANGUAGE:-en}   # en | ru — язык Django-подсистемы

services:
  api:
    build:
      context: ./api
    container_name: api
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
    volumes:
      - ./api:/app
      - static_data:/app/static
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elastic:
        condition: service_healthy
    expose:
      - "8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py init_statuses &&
             (python manage.py createsuperuser --noinput || true) &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  tg_bot:
    build:
      context: ./tg_bot
    container_name: tg_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./tg_bot:/bot
      - ./api:/app/api:ro          # Django core models reused by the bot
      - media_data:/media          # uploads land in the shared media volume
    environment:
      <<: *app-env
      PYTHONPATH: /bot:/app/api
      BOT_MEDIA_DIR: /media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m bot

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: elastic
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  elastic_data:
  static_data:
  media_data:
