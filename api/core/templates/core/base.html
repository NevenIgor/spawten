<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Chat{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f2f4f7; }
    header { background: #1a73e8; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    header a { color: #fff; text-decoration: none; margin-left: 16px; }
    .container { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 16px; margin-bottom: 12px; }
    .lead-row { display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #e8f0fe; color: #1a73e8; border-radius: 12px; padding: 2px 10px; font-size: 13px; }
    .badge.unread { background: #1a73e8; color: #fff; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 10px; margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
    .msg.incoming { background: #fff; border: 1px solid #dadce0; }
    .msg.outgoing { background: #d2e3fc; margin-left: auto; }
    .meta { font-size: 11px; color: #777; margin-top: 4px; }
    form.send { display: flex; gap: 8px; margin-top: 16px; }
    form.send input[type=text] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    button { background: #1a73e8; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; cursor: pointer; font-size: 15px; }
    .error { background: #fce8e6; color: #c5221f; padding: 10px; border-radius: 6px; }
    .chat-panel { display: flex; flex-direction: column; min-height: 60vh; }
    .messages { flex: 1; overflow-y: auto; }
  </style>
</head>
<body>
<header>
  <div><strong>TG Chat</strong></div>
  <nav>
    <a href="{% url 'core:inbox' %}">Inbox</a>
    <a href="/admin/">Admin</a>
    {% if request.user.is_authenticated %}<a href="/admin/logout/">{% firstof request.user.get_username 'Logout' %}</a>{% endif %}
  </nav>
</header>
<div class="container">
  {% block content %}{% endblock %}
</div>
<script>
// Live-update: poll the chat JSON while the tab is open.
const _mb = document.getElementById('messages');
const pollUrl = _mb && _mb.dataset.poll;
if (pollUrl) {
  setInterval(async () => {
    try {
      const res = await fetch(pollUrl, {headers: {'Accept': 'application/json'}});
      if (!res.ok) return;
      const data = await res.json();
      const box = document.getElementById('messages');
      if (!box) return;
      const seen = new Set([...box.querySelectorAll('.msg')].map(el => el.dataset.id));
      let changed = false;
      for (const m of data.messages) {
        if (!seen.has(m.id)) {
          const div = document.createElement('div');
          div.className = 'msg ' + m.direction;
          div.dataset.id = m.id;
          div.textContent = m.text || '';
          if (m.media_url) { const img = document.createElement('img'); img.src = m.media_url; img.style.maxWidth='200px'; div.appendChild(img); }
          box.appendChild(div);
          changed = true;
        }
      }
      if (changed) box.scrollTop = box.scrollHeight;
    } catch (e) { /* ignore */ }
  }, 3000);
}
</script>
</body>
</html>
