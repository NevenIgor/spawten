{% extends "manager/base.html" %}
{% block title %}{{ t.mgr.login_title }}{% endblock %}
{% block content %}
<div class="login-box">
  <h1>{{ t.mgr.login_title }}</h1>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>{{ t.mgr.username }}
      <input type="text" name="username" autofocus required>
    </label>
    <label>{{ t.mgr.password }}
      <input type="password" name="password" required>
    </label>
    <button class="btn btn-primary" type="submit">{{ t.mgr.sign_in }}</button>
  </form>
</div>
{% endblock %}
